<div style="padding:20px">

  <label>

    Theme

  </label>

  <select (change)="changeMode($event)">

    <option value="light">

      Light

    </option>

    <option value="dark">

      Dark

    </option>

  </select>

  <label style="margin-left:20px">

    Color

  </label>

  <select (change)="changePalette($event)">

    <option value="blue">

      Blue

    </option>

    <option value="brown">

      Brown

    </option>

    <option value="purple">

      Purple

    </option>

  </select>

</div>
